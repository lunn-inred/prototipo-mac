[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-performance"
version = "1.0.0"
requires-python = ">=3.10"
description = "MAC Performance API, Streamlit client and desktop launcher"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "desktop*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"backend" = ["bootstrap/*.sql", "bootstrap/*.json", "migrations/*.sql"]
"backend.mac_api" = ["assets/fonts/*.ttf", "assets/fonts/LICENSE.txt"]
"frontend.streamlit" = ["pages/*.py", "assets/*.png", "assets/fonts/*.ttf", "assets/fonts/LICENSE.txt", "assets/vendor/body-muscles/2.1.1/*", ".streamlit/config.toml"]
