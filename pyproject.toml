[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-performance"
version = "1.0.0"
requires-python = ">=3.10"
description = "MAC Performance API, Streamlit client and desktop launcher"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "desktop*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"frontend.streamlit" = ["pages/*.py", "assets/*.png", ".streamlit/config.toml"]
