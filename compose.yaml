services:
  db-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MAC_LOCAL_DB_USER:-mac_dev}
      POSTGRES_PASSWORD: ${MAC_LOCAL_DB_PASSWORD:-mac_dev_local}
      POSTGRES_DB: mac_dev
    ports: ["127.0.0.1:${MAC_LOCAL_DB_PORT:-55433}:5432"]
    volumes:
      - mac_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mac_dev"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: ${MAC_ENV_FILE:-.env}
    environment:
      MAC_ENVIRONMENT: ${MAC_ENVIRONMENT:-development}
      MAC_DB_TARGET: ${MAC_DB_TARGET:-local}
      MAC_LOCAL_DB_HOST: db-dev
      MAC_LOCAL_DB_PORT: "5432"
      MAC_LOCAL_DB_NAME: mac_dev
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/thermography
        target: /app/data/thermography
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      MAC_API_BASE_URL: http://backend:8000
      MAC_API_KEY: ${MAC_API_KEY:-}
      MAC_API_TIMEOUT_SECONDS: ${MAC_API_TIMEOUT_SECONDS:-300}
    ports: ["8501:8501"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  postgres-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: mac_test
      POSTGRES_PASSWORD: mac_test_local
      POSTGRES_DB: mac_test
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./backend/tests/fixtures/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac_test -d mac_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mac_dev_data:
